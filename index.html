<style>
/* 색: 파스텔 무드보드. 바깥은 구름 하늘 그라데이션, 종이 안 색은 요일 마스킹테이프·Dream 인덱스·형광펜에만. 종이는 고정 크기(360×620), 줄 26px. */
:root{--ink:#3B3346;--sub:#6F6579;--faint:#8C8296;--line:#ECE3EE;--paper:#FFFEFC;--dream:#F2EDF7;
--sky:linear-gradient(180deg,#F6CFD0 0%,#EBDDEE 50%,#D3ECEA 100%);
--gold:linear-gradient(180deg,#EED79C 0%,#CFA752 42%,#9C7228 58%,#D9B867 100%);--goldc:#C29A4C;
--hl:#F6C4CB;--blue:#4F86A9;--dot:#E293A2;
--hand:'Gowun Batang',serif;--sans:'IBM Plex Sans KR',system-ui,sans-serif;--it:'Cormorant Garamond',serif;--mono:'IBM Plex Mono',monospace;
--row:26px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none;overflow:hidden}
body{background:var(--sky) fixed;color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
[hidden]{display:none!important}
#desk{position:fixed;inset:0;overflow:hidden;touch-action:pan-y}
body.pc #desk{overflow:auto}
body.pc #stage{padding:0 16px 60px 0}
body.editing #desk{overflow-y:auto}
#stage{position:absolute}
#book{position:relative;display:flex}
.dh .d{cursor:pointer}
#jump{position:fixed;left:50%;top:40%;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.pg{width:var(--pw);height:var(--ph);background:var(--paper);position:relative;flex:none;box-shadow:0 10px 28px rgba(59,51,70,.13)}
.two .pg.l{box-shadow:0 10px 28px rgba(59,51,70,.13),inset -16px 0 18px -16px rgba(59,51,70,.2)}
.two .pg.r{box-shadow:0 10px 28px rgba(59,51,70,.13),inset 16px 0 18px -16px rgba(59,51,70,.2)}
.pg.dream{background:var(--dream)}
.pb{position:absolute;top:var(--pt);left:var(--ps);width:var(--cw);height:var(--ch);background-image:linear-gradient(var(--line),var(--line)),repeating-linear-gradient(180deg,transparent 0,transparent calc(var(--row) - 1px),var(--line) calc(var(--row) - 1px),var(--line) var(--row));background-size:100% 1px,auto;background-repeat:no-repeat,repeat}
.pg.dream .pb{background-image:linear-gradient(rgba(59,51,70,.09),rgba(59,51,70,.09)),repeating-linear-gradient(180deg,transparent 0,transparent calc(var(--row) - 1px),rgba(59,51,70,.09) calc(var(--row) - 1px),rgba(59,51,70,.09) var(--row))}
.pn{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:10px;color:var(--faint)}
/* 마스킹테이프(양끝 톱니 6개) */
.tape{position:absolute;opacity:.9;clip-path:polygon(100% 0,calc(100% - 2px) 8.33%,100% 16.67%,calc(100% - 2px) 25%,100% 33.33%,calc(100% - 2px) 41.67%,100% 50%,calc(100% - 2px) 58.33%,100% 66.67%,calc(100% - 2px) 75%,100% 83.33%,calc(100% - 2px) 91.67%,100% 100%,0 100%,2px 91.67%,0 83.33%,2px 75%,0 66.67%,2px 58.33%,0 50%,2px 41.67%,0 33.33%,2px 25%,0 16.67%,2px 8.33%,0 0)}
/* 페이지 안 글: 모든 줄이 26px 줄눈 위에 */
.bk{font-family:var(--hand);font-size:14px;line-height:var(--row);white-space:pre-wrap;word-break:break-all;text-align:justify;margin:0;min-height:var(--row)}
.dh{height:var(--row);display:flex;align-items:center;justify-content:space-between;position:relative}
.dh .d{position:relative;font-family:var(--it);font-style:italic;font-weight:600;font-size:21px;line-height:var(--row);padding:0 3px}
.dh .d .tape{left:-5px;right:-8px;top:4px;height:18px;transform:rotate(-2deg)}
.dh .d b{position:relative;font-weight:600}
.dh .m{font-family:var(--mono);font-size:11px;color:var(--sub);line-height:var(--row)}
.dh .pen{position:absolute;right:-8px;top:-24px;width:32px;height:22px;display:grid;place-items:center;opacity:.55}
.dh .pen:hover{opacity:1}
.dh .pen svg{width:14px;height:14px;fill:none;stroke:var(--ink);stroke-width:1.5}
.dh.ghost .d,.dh.ghost .m{opacity:.5}
.pb>.wh:first-child,#meas>.wh:first-child{margin-top:0}
.wh{margin-top:var(--row);font-family:var(--hand);font-size:12px;line-height:var(--row);height:var(--row);color:var(--sub)}
.wi{font-family:var(--hand);font-size:14px;line-height:var(--row);display:flex;gap:6px;cursor:pointer;word-break:break-all}
.wi .n{font-family:var(--mono);font-size:11px;color:var(--sub);min-width:18px;flex:none}
.wi .t{flex:1;min-width:0}
.wi .dt{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:6px;white-space:nowrap;line-height:1;vertical-align:1px}
.hl{background:linear-gradient(105deg,transparent 0,transparent 5px,var(--hl) 5px,var(--hl) calc(100% - 5px),transparent calc(100% - 5px)) 0 100%/100% 58% no-repeat;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 5px;margin:0 -5px}
.dots{color:var(--dot);letter-spacing:1px;margin-left:5px;font-size:12px;line-height:1}
.new{font-family:var(--hand);font-size:14px;line-height:var(--row);color:var(--sub);cursor:pointer;display:flex;align-items:center;gap:6px}
.new svg{width:14px;height:14px;fill:none;stroke:var(--sub);stroke-width:1.5}
/* Dream */
.at{height:var(--row);font-family:var(--hand);font-weight:700;font-size:15px;line-height:var(--row);margin-bottom:var(--row)}
.ai{font-family:var(--hand);font-size:12px;line-height:var(--row);color:var(--blue);padding-left:24px;display:flex;justify-content:space-between;gap:8px}
.ai button{font-family:var(--sans);font-size:11px;color:var(--sub);text-decoration:underline;height:var(--row)}
.af{height:calc(var(--row) * 2);padding-left:24px;display:flex;flex-direction:column}
.af .r{height:var(--row);display:flex;align-items:center;gap:8px}
.af input{border:none;border-bottom:1px solid var(--ink);outline:none;background:transparent;height:22px;padding:0;font-family:var(--hand);font-size:13px;color:var(--blue)}
.af input[type=date]{font-family:var(--mono);font-size:12px;width:126px}
.af .r button{font-size:12px;height:22px;padding:0 8px;border:1px solid var(--ink)}
.af .r button.pri{background:var(--ink);color:#fff}
.af .r button.lnk{border:none;text-decoration:underline;color:var(--sub);padding:0 2px}
/* 표지 */
.cv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:132px 0 92px}
.cv .fr{position:absolute;inset:16px;border:1px solid var(--goldc);pointer-events:none}
.cv .fr::after{content:'';position:absolute;inset:4px;border:1px solid rgba(194,154,76,.5)}
.gold{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.cv .sm{font-family:var(--it);font-style:italic;font-weight:600;font-size:15px;letter-spacing:1px;padding:0 6px 3px}
.cv .big{font-family:var(--it);font-weight:600;font-size:66px;line-height:1;letter-spacing:8px;padding:4px 0 6px 8px;filter:drop-shadow(0 1px 0 rgba(110,78,22,.25))}
.cv .ko{font-family:var(--hand);font-size:12px;letter-spacing:3px;padding:0 4px 2px}
.cv .rule{display:flex;align-items:center;gap:7px;margin:16px 0}
.cv .rule i{display:block;width:62px;height:1px;background:linear-gradient(90deg,transparent,var(--goldc))}
.cv .rule i+b+i{background:linear-gradient(90deg,var(--goldc),transparent)}
.cv .rule b{width:5px;height:5px;background:var(--goldc);transform:rotate(45deg)}
.cv .ytape{margin-top:auto;position:relative;width:96px;height:22px;display:grid;place-items:center;cursor:pointer}
.cv .ytape .tape{inset:0}
.cv .ytape span{position:relative;font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:2px;color:var(--ink)}
/* 쪽 넘기기: 아래 모서리. 마우스를 올리거나 누르는 동안 모퉁이가 살짝 들린 그늘 */
.cnr{position:absolute;bottom:0;width:96px;height:96px;z-index:2;cursor:pointer}
.cnr.cl{left:0}.cnr.cr{right:0}
.cnr::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .22s ease}
.cnr.cr::before{background:radial-gradient(circle at 100% 100%,rgba(59,51,70,.2) 0,rgba(59,51,70,.09) 34px,rgba(59,51,70,.025) 62px,transparent 90px)}
.cnr.cl::before{background:radial-gradient(circle at 0 100%,rgba(59,51,70,.2) 0,rgba(59,51,70,.09) 34px,rgba(59,51,70,.025) 62px,transparent 90px)}
@media(hover:hover){.cnr:hover::before{opacity:1}}
.cnr.on::before{opacity:1}
.cnr.off{display:none}
/* Dream 인덱스: 살짝 둥글게 깎인 납작한 사다리꼴 */
#tab{position:absolute;z-index:3;display:grid;place-items:center;font-family:var(--it);font-style:italic;font-weight:600;font-size:16px;color:var(--ink)}
#tab svg{position:absolute;inset:0;width:100%;height:100%}
#tab svg path{fill:var(--dream)}
#tab span{position:relative}
.one #tab{width:88px;height:30px}
.two #tab{width:30px;height:88px}.two #tab span{writing-mode:vertical-rl}
/* 쓰기: 보이는 종이 그대로 (여러 쪽은 칼럼으로 이어짐) */
.pg.edit{overflow:hidden}
#edCols{height:var(--ph);overflow:hidden;padding:var(--pt) var(--ps) var(--pbm);column-width:var(--cw);column-gap:calc(var(--ps) * 2);column-fill:auto;
 background:linear-gradient(90deg,var(--paper) 0,var(--paper) var(--ps),transparent var(--ps),transparent calc(var(--pw) - var(--ps)),var(--paper) calc(var(--pw) - var(--ps))) 0 0/var(--pw) 100% repeat-x local,
  linear-gradient(var(--line),var(--line)) 0 var(--pt)/100% 1px no-repeat local,
  repeating-linear-gradient(180deg,transparent 0,transparent calc(var(--row) - 1px),var(--line) calc(var(--row) - 1px),var(--line) var(--row)) 0 var(--pt)/100% var(--ch) no-repeat local,
  var(--paper)}
#edCols .dh .d input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
#edBody{outline:none;cursor:text}
#edBody:empty::before{content:'오늘은 어땠어요?';color:var(--faint)}
.wl{height:var(--row);display:flex;align-items:center;gap:6px;break-inside:avoid}
.wl .n{font-family:var(--mono);font-size:11px;color:var(--sub);min-width:18px}
.wl .fw{position:relative;flex:1;min-width:0;height:var(--row)}
.wl .mir{position:absolute;left:0;top:0;white-space:pre;color:transparent;font-family:var(--hand);font-size:14px;line-height:var(--row);pointer-events:none;max-width:100%;overflow:hidden}
.wl input{position:relative;width:100%;height:var(--row);border:none;outline:none;background:transparent;font-family:var(--hand);font-size:14px;padding:0}
#edSug{position:fixed;background:var(--paper);border:1px solid var(--ink);z-index:12;max-height:200px;overflow:auto}
#edSug button{display:flex;align-items:center;justify-content:space-between;width:100%;height:38px;padding:0 12px;text-align:left;font-family:var(--hand);font-size:14px}
#edSug button.on,#edSug button:hover{background:var(--line)}
#edSug i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--sub)}
#edBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:8}
#edBar button{width:40px;height:40px;border:1px solid var(--ink);background:#fff;display:grid;place-items:center}
#edBar button.pri{background:var(--ink)}
#edBar svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:1.6}
#edBar .pri svg{stroke:#fff}
/* 왼쪽 아래 아이콘 (이동 메뉴 ▦ 옆, 같은 모양) */
#tools{position:fixed;left:calc(42px + env(safe-area-inset-left,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;z-index:6}
#tools button{width:28px;height:28px;border:1px solid #111;background:#fff;opacity:.45;display:grid;place-items:center}
#tools button:hover{opacity:1}
#tools svg{width:15px;height:15px;fill:none;stroke:#111;stroke-width:1.5}
body.editing #tools{display:none}
.menu{position:fixed;background:var(--paper);border:1px solid var(--ink);box-shadow:2px 2px 0 rgba(59,51,70,.18);z-index:20;min-width:150px;padding:4px 0}
.menu button{display:block;width:100%;text-align:left;height:40px;padding:0 14px;font-size:14px}
.menu button:hover{background:var(--line)}.menu .on{font-weight:600}
/* 로그인 */
#login{max-width:340px;margin:16vh auto 0;padding:28px 24px 24px;background:var(--paper);box-shadow:0 10px 28px rgba(59,51,70,.13)}
#login .nm{font-family:var(--it);font-style:italic;font-weight:600;font-size:42px}
#login input{display:block;width:100%;height:44px;border:none;border-bottom:1px solid var(--ink);outline:none;background:transparent;margin-top:4px;font-size:15px}
#login label{display:block;font-size:12px;color:var(--sub);margin-top:16px}
#login .pri{width:100%;height:46px;margin-top:22px;background:var(--ink);color:#fff;font-weight:600}
#lmsg{font-size:13px;color:#B4506A;min-height:18px;margin:10px 0 0}
#toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:10px 16px;z-index:30;max-width:90vw}
#meas{position:absolute;left:-9999px;top:0;visibility:hidden}
</style></head>

<div id="login" hidden><div class="nm">dodo</div><div style="font-size:13px;color:var(--sub)">하고 싶은 것 일기</div>

<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=(p,o)=>Core.rest(p,o);
const WD='일월화수목금토', WDE=['SUN','MON','TUE','WED','THU','FRI','SAT'];
/* 요일 테이프 색 (일~토) */
const DAYC=['#F2A7A9','#A9CFEC','#F5C69B','#D3D98F','#9ED8D4','#CDB2E6','#F2B0CB'];
const ROW=26;
const dow=d=>new Date(d+'T12:00:00Z').getUTCDay();
const kstIso=ts=>new Date(ts+9*3600e3).toISOString();
/* 일기 날짜는 오전 6시 기준: 6시 전에 쓰기 시작하면 전날 일기 */
const logicalDay=(ts=Date.now())=>kstIso(ts-6*3600e3).slice(0,10);
const hm=iso=>iso?kstIso(Date.parse(iso)).slice(11,16):'';
const md=d=>d.slice(5).replace('-','.');
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2400)}
const LS={get(k,d){try{const v=localStorage.getItem('dodo:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('dodo:'+k,JSON.stringify(v))}catch(e){}}};

const S={year:+logicalDay().slice(0,4),entries:[],days:[],wishes:[],links:[],mode:'diary',dp:[],ap:[],p:0,pa:0,open:null,form:null,ed:null,L:null};

/* ---------- 데이터 ---------- */
async function loadAll(){
  const y=S.year;
  const [ents,days,wishes,links]=await Promise.all([
    q(`dodo_entry?select=id,day,body,started_at&day=gte.${y}-01-01&day=lte.${y}-12-31&order=day.asc`),
    q('dodo_entry?select=day&order=day.asc'),
    q('dodo_wish?select=id,text,done_on,done_memo&order=created_at.asc'),
    q('dodo_entry_wish?select=entry_id,wish_id,pos,dodo_entry(day)')
  ]);
  S.entries=ents||[];S.days=(days||[]).map(r=>r.day);S.wishes=wishes||[];
  S.links=(links||[]).map(l=>({entry_id:l.entry_id,wish_id:l.wish_id,pos:l.pos,day:l.dodo_entry&&l.dodo_entry.day}));
}
const wishOf=id=>S.wishes.find(w=>w.id===id);
const entryLinks=eid=>S.links.filter(l=>l.entry_id===eid).sort((a,b)=>a.pos-b.pos);
const wishCount=id=>S.links.filter(l=>l.wish_id===id).length;

/* ---------- 글 칸은 어디서나 같은 크기(폭 304 × 21줄) → 줄 수·줄바꿈이 휴대폰·PC 똑같음.
   종이 여백만 다름: 휴대폰은 화면 폭·높이에 맞춰 꽉, PC는 넉넉한 여백에 원래 크기(창이 작으면 스크롤). ---------- */
const TAB=30,CW=304,ROWS=21,CH=ROWS*ROW;
const coarse=()=>matchMedia('(pointer:coarse)').matches;
function measureLayout(){
  const vw=innerWidth,vh=innerHeight;
  const P={ps:52,pt:52,pbm:56};const PWp=CW+P.ps*2,PHp=CH+P.pt+P.pbm;

/* groups: 그룹마다 새 쪽에서 시작. 글 문단은 음절 단위로 잘라 다음 쪽으로 넘김 */
function paginate(groups){
  const meas=$('#meas'),CH=S.L.ch,pages=[];
  for(const g of groups){
    const queue=g.slice();let cur=[];pages.push(cur);meas.innerHTML='';
    while(queue.length){
      const b=queue.shift(),node=el(blockHTML(b));meas.appendChild(node);
      if(meas.scrollHeight<=CH){cur.push(node.outerHTML);continue}
      if(b.k==='p'&&b.t.length>1){
        const t=Array.from(b.t);let lo=0,hi=t.length;
        while(lo<hi){const mid=Math.ceil((lo+hi)/2);node.textContent=t.slice(0,mid).join('');if(meas.scrollHeight<=CH)lo=mid;else hi=mid-1}
        if(lo>0){node.textContent=t.slice(0,lo).join('');cur.push(node.outerHTML);queue.unshift({k:'p',t:t.slice(lo).join('')})}
        else if(!cur.length){cur.push(node.outerHTML)}
        else{meas.removeChild(node);queue.unshift(b)}
      }else{
        meas.removeChild(node);
        if(!cur.length)cur.push(node.outerHTML);else queue.unshift(b);
      }
      if(queue.length){cur=[];pages.push(cur);meas.innerHTML=''}
    }
  }
  meas.innerHTML='';return pages;
}
function diaryGroups(){
  const groups=[];
  for(const e of S.entries){
    const g=[{k:'date',day:e.day,hm:hm(e.started_at)}];
    const body=(e.body||'').replace(/\s+$/,'');
    if(body)body.split('\n').forEach(t=>g.push({k:'p',t}));
    const ls=entryLinks(e.id);
    if(ls.length){g.push({k:'wh'});ls.forEach((l,i)=>{const w=wishOf(l.wish_id);if(w)g.push({k:'w',n:i+1,text:w.text,done:!!w.done_on,key:l.entry_id+':'+l.wish_id})})}
    groups.push(g);
  }
  const t=logicalDay();
  if(+t.slice(0,4)===S.year&&!S.entries.some(e=>e.day===t))groups.push([{k:'date',day:t,ghost:true},{k:'new',day:t}]);
  return groups;
}
function apxGroups(){
  const g=[{k:'at'}],seen={};let n=0;
  for(const e of S.entries){
    entryLinks(e.id).forEach(l=>{const w=wishOf(l.wish_id);if(!w)return;
      seen[w.id]=(seen[w.id]||0)+1;n++;
      const key=l.entry_id+':'+l.wish_id;
      g.push({k:'aw',n,text:w.text,done:!!w.done_on,occ:seen[w.id],key,day:e.day});
      if(S.form===key)g.push({k:'af',key,date:w.done_on||logicalDay(),memo:w.done_memo||'',done:!!w.done_on});
      else if(S.open===key&&w.done_on)g.push({k:'ai',key,date:w.done_on,memo:w.done_memo});
    });
  }
  if(!n)g.push({k:'p',t:'일기 끝에 하고 싶은 것을 적으면 여기에 차례로 모여요.'});
  return [g];
}

function caretRect(){
  const a=document.activeElement;
  if(a&&a.tagName==='INPUT'&&a.closest('#edCols'))return a.getBoundingClientRect();
  const s=getSelection();if(!s.rangeCount)return null;
  const r=s.getRangeAt(0).cloneRange();r.collapse(true);
  let rc=r.getClientRects()[0];
  if(!rc){const sp=document.createElement('span');sp.textContent='​';r.insertNode(sp);rc=sp.getBoundingClientRect();sp.remove();$('#edBody').normalize()}
  return rc;
}
function follow(){
  const box=$('#edCols');if(!box||!S.ed)return;
  const rc=caretRect();if(!rc)return;
  const br=box.getBoundingClientRect(),k=br.width/box.clientWidth||1,W=S.L.W;
  const x=(rc.left-br.left)/k+box.scrollLeft;
  const page=Math.max(0,Math.floor(x/W)),first=Math.round(box.scrollLeft/W),cols=S.ed.cols;
  let nf=first;
  if(page<first)nf=page;else if(page>first+cols-1)nf=page-cols+1;
  if(box.scrollLeft!==nf*W)box.scrollLeft=nf*W;
}

    if(E.id&&day!==E.day){
      if(other)await q(`dodo_entry?id=eq.${E.id}`,{method:'DELETE'});
      else await q(`dodo_entry?id=eq.${E.id}`,{method:'PATCH',body:JSON.stringify({day,updated_at:now})});
    }
    const row={day,body,updated_at:now};if(E.isNew||other)row.started_at=E.started;
    const rows=await q('dodo_entry?on_conflict=user_id,day',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify([row])});
    const eid=rows[0].id;let ids=[];
    if(wishes.length){
      const ws=await q('dodo_wish?on_conflict=user_id,text',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify(wishes.map(text=>({text})))});
      ids=wishes.map(t=>(ws.find(w=>w.text===t)||{}).id).filter(Boolean);
    }
    await q(`dodo_entry_wish?entry_id=eq.${eid}`,{method:'DELETE'});
    if(ids.length)await q('dodo_entry_wish',{method:'POST',body:JSON.stringify(ids.map((wish_id,pos)=>({entry_id:eid,wish_id,pos})))});
    await cleanOrphans();
    S.ed=null;document.body.classList.remove('editing');$('#edBar').hidden=true;$('#edSug').hidden=true;$('#desk').scrollTop=0;
    if(+day.slice(0,4)!==S.year)S.year=+day.slice(0,4);
    await refresh(true);goDay(day);toast('저장했어요');
  }catch(e){toast(e.message)}finally{btn.disabled=false}
};
$('#edDel').onclick=async()=>{
  if(!S.ed||!S.ed.id)return;
  if(!confirm(S.ed.day+' 일기를 지울까요? 되돌릴 수 없어요.'))return;
  try{await q(`dodo_entry?id=eq.${S.ed.id}`,{method:'DELETE'});await cleanOrphans();S.ed=null;document.body.classList.remove('editing');$('#edBar').hidden=true;await refresh(true);toast('지웠어요')}catch(e){toast(e.message)}
};
/* 어떤 일기에도 없고 이룸 표시도 없는 하고 싶은 것은 정리 */
async function cleanOrphans(){
  const links=await q('dodo_entry_wish?select=wish_id');const used=new Set((links||[]).map(l=>l.wish_id));
  const ws=await q('dodo_wish?select=id,done_on');const gone=(ws||[]).filter(w=>!used.has(w.id)&&!w.done_on).map(w=>w.id);
  if(gone.length)await q(`dodo_wish?id=in.(${gone.join(',')})`,{method:'DELETE'});
}

/* ---------- md로 내보내기 ---------- */
function entryMd(e){
  const ws=entryLinks(e.id).map(l=>wishOf(l.wish_id)).filter(Boolean);
  let s=`# ${e.day} (${WD[dow(e.day)]})${e.started_at?` · ${hm(e.started_at)} 시작`:''}\n\n${(e.body||'').trim()}\n`;
  if(ws.length)s+=`\n## 언젠가 해보고 싶은 나의 꿈\n`+ws.map((w,i)=>`${i+1}. ${w.text}${w.done_on?` (이룸 ${w.done_on}${w.done_memo?' · '+w.done_memo:''})`:''}`).join('\n')+'\n';
  return s;
}
function apxMd(){
  let s='# 나의 꿈 목록\n\n',n=0;
  for(const e of S.entries)entryLinks(e.id).forEach(l=>{const w=wishOf(l.wish_id);if(!w)return;n++;
    s+=`${n}. ${w.text} (${slash(e.day)})${w.done_on?` — 이룸 ${w.done_on}${w.done_memo?' · '+w.done_memo:''}`:''}\n`});
  return s;
}
async function exportMd(){
  const y=S.year;
  if(window.showDirectoryPicker){
    try{
      const root=await showDirectoryPicker({mode:'readwrite'});
      const dir=await root.getDirectoryHandle('dodo-'+y,{create:true});
      const put=async(name,text)=>{const f=await dir.getFileHandle(name,{create:true});const w=await f.createWritable();await w.write(text);await w.close()};
      for(const e of S.entries)await put(e.day+'.md',entryMd(e));
      await put('Dream.md',apxMd());
      toast(`dodo-${y} 폴더에 ${S.entries.length}개 저장했어요`);return;
    }catch(e){if(e.name==='AbortError')return;toast('폴더에 쓰지 못해 한 파일로 받을게요')}
  }
  const text=S.entries.map(entryMd).join('\n---\n\n')+'\n---\n\n'+apxMd();
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/markdown'}));a.download=`dodo-${y}.md`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

/* ---------- 버튼들 ---------- */
let dp=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});
addEventListener('appinstalled',()=>{dp=null;$('#instBtn').hidden=true});
if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)$('#instBtn').hidden=true;
$('#instBtn').onclick=()=>{if(dp){dp.prompt();dp=null}else if(/iPhone|iPad/.test(navigator.userAgent))alert('공유 버튼 → 홈 화면에 추가를 눌러 주세요.');else alert('이미 설치돼 있거나 지금은 설치 버튼이 없어요. 앱을 지우고 다시 열면 버튼이 생겨요.')};
$('#reBtn').onclick=()=>location.reload();
$('#expBtn').onclick=exportMd;
$('#outBtn').onclick=async()=>{if(!confirm('로그아웃할까요? (다른 앱도 같이 로그아웃돼요)'))return;await Core.logout();location.reload()};
function closeMenu(){const m=$('#menu');if(m)m.remove()}
function yearMenu(anchorEl){
  closeMenu();
  const ys=[...new Set(S.days.map(d=>+d.slice(0,4)).concat([+logicalDay().slice(0,4),S.year]))].sort((a,b)=>b-a);
  const m=document.createElement('div');m.className='menu';m.id='menu';
  m.innerHTML=ys.map(y=>`<button data-y="${y}" class="${y===S.year?'on':''}">${y}년 다이어리</button>`).join('');
  document.body.appendChild(m);const r=anchorEl.getBoundingClientRect();
  const top=r.top>innerHeight/2?r.top-m.offsetHeight-6:r.bottom+6;
  m.style.top=top+'px';m.style.left=Math.max(8,Math.min(r.left,innerWidth-m.offsetWidth-8))+'px';
  m.onclick=e=>{const b=e.target.closest('button');if(!b)return;closeMenu();const y=+b.dataset.y;if(y!==S.year){S.year=y;S.mode='diary';refresh()}};
  setTimeout(()=>document.addEventListener('click',closeMenu,{once:true}),0);
}
$('#book').addEventListener('click',e=>{
  if(S.ed)return;
  const t=e.target;
  if(t.closest('#tab')){S.mode=S.mode==='apx'?'diary':'apx';S.form=null;if(S.mode==='apx')S.ap=paginate(apxGroups());render();return}
  if(t.closest('#cvYear')){e.stopPropagation();yearMenu(t.closest('#cvYear'));return}
  const cn=t.closest('.cnr');if(cn){cn.classList.remove('on');turn(+cn.dataset.turn);return}
  if(S.mode==='apx'){
    const b=t.closest('button');
    if(b&&b.dataset.asave){apxSave(b.dataset.asave);return}
    if(b&&b.dataset.aundo){apxUndo(b.dataset.aundo);return}
    if(b&&b.dataset.aclose){const k=S.form;S.form=null;apxReflow(k);return}
    if(b&&b.dataset.fix){S.form=b.dataset.fix;apxReflow(S.form);setTimeout(()=>{const m=$('#afMemo');if(m)m.focus()},30);return}
    if(t.closest('.af'))return;
    const r=t.closest('[data-akey]');
    if(r){const key=r.dataset.akey,w=wishOf(key.split(':')[1]);
      if(w&&w.done_on){S.form=null;S.open=S.open===key?null:key}else{S.open=null;S.form=S.form===key?null:key}
      apxReflow(key);if(S.form===key)setTimeout(()=>{const m=$('#afMemo');if(m)m.focus()},30);return}
    return;
  }
  const pen=t.closest('[data-edit]');if(pen){openEditor(pen.dataset.edit);return}
  const nw=t.closest('[data-new]');if(nw){openEditor(null);return}
  const w=t.closest('[data-key]');
  if(w){const key=w.dataset.key,wo=wishOf(key.split(':')[1]);S.mode='apx';
    if(wo&&wo.done_on){S.open=key;S.form=null}else{S.form=null;S.open=null}
    apxReflow(key);return}
  const dd=t.closest('.dh .d');if(dd){const pen=dd.parentNode.querySelector('[data-edit]');openJump(pen?pen.dataset.edit:logicalDay());return}
});
/* 날짜를 누르면 날짜 고르기 → 그날(없으면 가장 가까운 다음 날) 쪽으로 */
function openJump(day){const j=$('#jump');j.value=day;try{j.showPicker()}catch(e){j.style.pointerEvents='auto';j.focus();j.click();j.style.pointerEvents='none'}}
$('#jump').addEventListener('change',e=>{const d=e.target.value;if(/^\d{4}-\d{2}-\d{2}$/.test(d))jumpTo(d)});
function jumpTo(d){
  const go=()=>{const ds=S.entries.map(x=>x.day),t=ds.find(x=>x>=d)||ds[ds.length-1];if(!t){toast('그 해에 쓴 일기가 없어요');return}if(t!==d)toast(t.replace(/-/g,'.')+' 일기로 갔어요');goDay(t)};
  const y=+d.slice(0,4);S.mode='diary';
  if(y!==S.year){S.year=y;refresh().then(go)}else go();
}
$('#book').addEventListener('pointerdown',e=>{const c=e.target.closest('.cnr');if(c)c.classList.add('on')});
['pointerup','pointercancel','pointerleave'].forEach(ev=>$('#book').addEventListener(ev,e=>{$$('.cnr.on').forEach(c=>{if(ev!=='pointerup'||c!==e.target.closest('.cnr'))c.classList.remove('on')})},true));
let tx=null,ty=null;
$('#desk').addEventListener('touchstart',e=>{if(S.ed)return;tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$('#desk').addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)turn(dx<0?1:-1)},{passive:true});
document.addEventListener('keydown',e=>{if(S.ed||$('#app').hidden)return;if(e.target.closest('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft'){e.preventDefault();turn(-1)}if(e.key==='ArrowRight'){e.preventDefault();turn(1)}});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(!$('#app').hidden&&S.L)relayout()},150)});

/* ---------- 로그인 ---------- */
async function show(){
  const on=!!Core.ses();$('#login').hidden=on;$('#app').hidden=!on;
  if(on)await refresh();
}
$('#go').onclick=async()=>{$('#lmsg').textContent='';try{await Core.login($('#lem').value.trim(),$('#lpw').value);show()}catch(e){$('#lmsg').textContent=e.message}};
$('#lpw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});
if(window.Core)show();else{$('#login').hidden=false;$('#lmsg').textContent='공용 파일(core)을 불러오지 못했어요. 새로고침해 주세요.'}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
